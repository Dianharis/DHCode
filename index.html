<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Kalkulator Pintar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="callkulator">
    <input type="text" class="display" id="display" readonly /> 

    <div class="button">
      <button class="btn" onclick="appendValue('1')">1</button>
      <button class="btn" onclick="appendValue('2')">2</button>
      <button class="btn" onclick="appendValue('3')">3</button>
      <button class="btn opr" onclick="appendValue('+')">+</button>
      
      <button class="btn" onclick="appendValue('4')">4</button>
      <button class="btn" onclick="appendValue('5')">5</button>
      <button class="btn" onclick="appendValue('6')">6</button>
      <button class="btn opr" onclick="appendValue('-')">-</button>
      
      <button class="btn" onclick="appendValue('7')">7</button>
      <button class="btn" onclick="appendValue('8')">8</button>
      <button class="btn" onclick="appendValue('9')">9</button>
      <button class="btn opr" onclick="appendValue('/')">/</button>
      
      <button class="btn" onclick="appendValue('0')">0</button>
      <button class="btn opr" onclick="appendValue('*')">*</button>
      <button class="btn opr" onclick="appendValue('%')">%</button>
      <button class="btn opr" onclick="calculate()">=</button>
    </div>

    <!-- Tombol Clear dan Delete dalam 1 baris -->
    <div class="bottom-controls">
      <button class="btn clear" onclick="clearDisplay()">Clear</button>
      <button class="btn delete" onclick="deleteLast()">Delete</button>
    </div>

    <!-- History -->
    <div class="history">
      <strong>Riwayat:</strong>
      <ul id="history-list"></ul>
    </div>
  </div>

  <script src="scrip.js"></script>
</body>
</html>
